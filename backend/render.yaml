services:
  - type: web
    name: school-jainarkodi-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
